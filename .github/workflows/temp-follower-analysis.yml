name: Temporary follower analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    if: github.head_ref == 'temp/follower-analysis-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze public GitHub profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv, json, math, os, re, time, urllib.error, urllib.parse, urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          TARGET = 'YOUSSEF-BT'
          OUT = Path('output')
          OUT.mkdir(exist_ok=True)
          TOKEN = os.environ['GH_TOKEN']
          HEADERS = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {TOKEN}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'follower-profile-analysis'
          }

          def api(path, params=None, allow_404=False):
              url = 'https://api.github.com' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              for attempt in range(5):
                  req = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode()), dict(r.headers)
                  except urllib.error.HTTPError as e:
                      if allow_404 and e.code == 404:
                          return None, dict(e.headers)
                      if e.code in (403, 429) and attempt < 4:
                          reset = int(e.headers.get('X-RateLimit-Reset', '0') or 0)
                          wait = max(2, min(60, reset - int(time.time()) + 2))
                          time.sleep(wait)
                          continue
                      raise

          def paged(path, params=None):
              params = dict(params or {})
              params['per_page'] = 100
              page = 1
              out = []
              while True:
                  params['page'] = page
                  data, _ = api(path, params)
                  out.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return out

          followers = paged(f'/users/{TARGET}/followers')
          usernames = [TARGET] + [u['login'] for u in followers if u.get('login') != TARGET]

          ai_terms = [
              'artificial intelligence','machine learning','deep learning','data science','computer vision',
              'natural language processing','nlp','large language model','llm','retrieval augmented generation',
              'rag','generative ai','pytorch','tensorflow','scikit','yolo','langchain','hugging face','mlops',
              'data engineering','analytics','big data','spark','airflow','mlflow'
          ]
          ai_pattern = re.compile('|'.join(re.escape(x) for x in ai_terms), re.I)
          test_names = {'test','tests','testing','__tests__','spec','specs'}
          dep_names = {'requirements.txt','pyproject.toml','poetry.lock','package.json','environment.yml','pom.xml','build.gradle'}

          def inspect_root(full_name):
              data, _ = api(f'/repos/{full_name}/contents', allow_404=True)
              if not isinstance(data, list):
                  return {}
              names = {str(x.get('name','')).lower() for x in data}
              return {
                  'readme': any(n.startswith('readme') for n in names),
                  'license': any(n.startswith('license') or n.startswith('licence') for n in names),
                  'tests': bool(names & test_names),
                  'ci': '.github' in names,
                  'docker': 'dockerfile' in names or 'docker-compose.yml' in names or 'docker-compose.yaml' in names,
                  'docs': 'docs' in names or 'documentation' in names,
                  'deps': bool(names & dep_names),
              }

          rows = []
          failures = []
          for idx, username in enumerate(usernames, 1):
              try:
                  profile, _ = api(f'/users/{username}')
                  repos = paged(f'/users/{username}/repos', {'type':'owner','sort':'updated'})
                  originals = [r for r in repos if not r.get('fork') and not r.get('archived')]
                  forks = [r for r in repos if r.get('fork')]
                  stars = sum(int(r.get('stargazers_count') or 0) for r in originals)
                  forks_received = sum(int(r.get('forks_count') or 0) for r in originals)
                  latest = max((r.get('pushed_at') or '' for r in originals), default='')
                  top = sorted(originals, key=lambda r:(int(r.get('stargazers_count') or 0), r.get('pushed_at') or ''), reverse=True)[:2]
                  inspections = [inspect_root(r['full_name']) for r in top]
                  quality = Counter()
                  for item in inspections:
                      quality.update({k:int(bool(v)) for k,v in item.items()})
                  text_parts = [profile.get('bio') or '', profile.get('company') or '']
                  ai_repo_count = 0
                  language_counts = Counter()
                  for r in originals:
                      language = r.get('language')
                      if language:
                          language_counts[language] += 1
                      text = ' '.join([
                          r.get('name') or '', r.get('description') or '', ' '.join(r.get('topics') or [])
                      ])
                      text_parts.append(text)
                      if ai_pattern.search(text):
                          ai_repo_count += 1
                  all_text = ' '.join(text_parts)
                  ai_hits = len({m.group(0).lower() for m in ai_pattern.finditer(all_text)})
                  profile_fields = [profile.get(k) for k in ('name','bio','company','location','blog','email')]
                  completeness = sum(bool(x) for x in profile_fields) / len(profile_fields)
                  created = datetime.fromisoformat(profile['created_at'].replace('Z','+00:00'))
                  account_age = (datetime.now(timezone.utc)-created).days/365.25
                  if latest:
                      pushed = datetime.fromisoformat(latest.replace('Z','+00:00'))
                      days_since_push = (datetime.now(timezone.utc)-pushed).days
                  else:
                      days_since_push = 9999
                  pythonish = sum(language_counts.get(k,0) for k in ('Python','Jupyter Notebook','R'))
                  language_total = sum(language_counts.values()) or 1
                  ai_fit = min(100, round(
                      (20 if ai_pattern.search(profile.get('bio') or '') else 0)
                      + min(50, ai_repo_count*5)
                      + min(20, 20*pythonish/language_total)
                      + (10 if top and ai_pattern.search(' '.join([top[0].get('name') or '', top[0].get('description') or ''])) else 0), 2
                  ))
                  rows.append({
                      'login': username,
                      'name': profile.get('name') or '',
                      'type': profile.get('type') or '',
                      'bio': profile.get('bio') or '',
                      'location': profile.get('location') or '',
                      'company': profile.get('company') or '',
                      'blog': profile.get('blog') or '',
                      'hireable': bool(profile.get('hireable')),
                      'followers': int(profile.get('followers') or 0),
                      'following': int(profile.get('following') or 0),
                      'public_repos': int(profile.get('public_repos') or 0),
                      'owned_repos_fetched': len(repos),
                      'original_repos': len(originals),
                      'fork_repos': len(forks),
                      'original_ratio': round(len(originals)/len(repos),4) if repos else 0,
                      'stars_received': stars,
                      'forks_received': forks_received,
                      'top_repo': top[0]['name'] if top else '',
                      'top_repo_stars': int(top[0].get('stargazers_count') or 0) if top else 0,
                      'top_repo_url': top[0].get('html_url') if top else '',
                      'top_repo_deployed': bool(top and top[0].get('homepage')),
                      'latest_push': latest,
                      'days_since_latest_push': days_since_push,
                      'account_age_years': round(account_age,2),
                      'profile_completeness': round(completeness,4),
                      'readme_top2': quality['readme'],
                      'license_top2': quality['license'],
                      'tests_top2': quality['tests'],
                      'ci_top2': quality['ci'],
                      'docker_top2': quality['docker'],
                      'docs_top2': quality['docs'],
                      'dependency_files_top2': quality['deps'],
                      'ai_repo_count': ai_repo_count,
                      'ai_keyword_hits': ai_hits,
                      'ai_data_fit_score': ai_fit,
                      'main_languages': ', '.join(k for k,_ in language_counts.most_common(5)),
                      'profile_url': profile.get('html_url') or f'https://github.com/{username}'
                  })
              except Exception as exc:
                  failures.append({'login':username,'error':repr(exc)})
              print(f'{idx}/{len(usernames)} {username}', flush=True)

          max_followers = max([r['followers'] for r in rows] + [1])
          max_stars = max([r['stars_received'] for r in rows] + [1])
          for r in rows:
              social = 15 * math.log1p(r['followers']) / math.log1p(max_followers)
              star_score = 20 * math.log1p(r['stars_received']) / math.log1p(max_stars)
              repo_score = 15 * min(1, r['original_repos']/20)
              q = 0
              q += 4 * min(1, r['readme_top2']/2)
              q += 3 * min(1, r['tests_top2'])
              q += 3 * min(1, r['ci_top2'])
              q += 2 * min(1, r['docker_top2'])
              q += 2 * min(1, r['license_top2'])
              q += 2 * min(1, r['docs_top2'])
              q += 2 * min(1, r['dependency_files_top2'])
              q += 2 if r['top_repo_deployed'] else 0
              profile_score = 10*r['profile_completeness']
              originality = 5*r['original_ratio']
              d = r['days_since_latest_push']
              recency = 15 if d <= 30 else 12 if d <= 90 else 9 if d <= 180 else 6 if d <= 365 else 3 if d <= 730 else 0
              strength = round(social+star_score+repo_score+q+profile_score+originality+recency,2)
              r['github_strength_score'] = strength
              r['ai_competitor_score'] = round(0.72*strength + 0.28*r['ai_data_fit_score'],2)

          def add_ranks(key, rank_name):
              ordered = sorted(rows, key=lambda x:(x[key], x['stars_received'], x['followers']), reverse=True)
              for rank, item in enumerate(ordered,1):
                  item[rank_name] = rank
                  item[rank_name+'_percentile'] = round(100*(len(ordered)-rank)/max(1,len(ordered)-1),2)

          add_ranks('github_strength_score','strength_rank')
          add_ranks('ai_competitor_score','ai_rank')
          target = next(r for r in rows if r['login'].lower() == TARGET.lower())
          relevant = [r for r in rows if r['ai_data_fit_score'] >= 30]
          relevant_sorted = sorted(relevant, key=lambda x:x['ai_competitor_score'], reverse=True)
          target['ai_relevant_rank'] = next((i for i,x in enumerate(relevant_sorted,1) if x['login'].lower()==TARGET.lower()), None)
          target['ai_relevant_population'] = len(relevant_sorted)

          rows_sorted = sorted(rows, key=lambda x:x['github_strength_score'], reverse=True)
          fieldnames = list(rows_sorted[0].keys())
          with open(OUT/'followers_analysis.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=fieldnames); w.writeheader(); w.writerows(rows_sorted)
          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'target': TARGET,
              'followers_found': len(followers),
              'profiles_analyzed': len(rows),
              'failures': failures,
              'target_metrics': target,
              'top_strength': rows_sorted[:30],
              'top_ai_data': relevant_sorted[:30],
              'profiles': rows_sorted
          }
          (OUT/'followers_analysis.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          md = [
              f'# GitHub follower analysis for {TARGET}', '',
              f'- Followers returned by API: **{len(followers)}**',
              f'- Profiles analyzed (target included): **{len(rows)}**',
              f'- Generic strength rank: **{target["strength_rank"]}/{len(rows)}**',
              f'- Generic percentile: **{target["strength_rank_percentile"]}%**',
              f'- AI/Data competitor rank: **{target["ai_rank"]}/{len(rows)}**',
              f'- AI/Data-relevant subset rank: **{target.get("ai_relevant_rank")}/{target.get("ai_relevant_population")}**',
              f'- Strength score: **{target["github_strength_score"]}/100**',
              f'- AI/Data fit score: **{target["ai_data_fit_score"]}/100**', '',
              '## Top 20 overall', '', '| Rank | User | Score | Followers | Stars | Original repos |', '|---:|---|---:|---:|---:|---:|'
          ]
          for x in rows_sorted[:20]:
              md.append(f'| {x["strength_rank"]} | [{x["login"]}]({x["profile_url"]}) | {x["github_strength_score"]} | {x["followers"]} | {x["stars_received"]} | {x["original_repos"]} |')
          md += ['', '## Top 20 AI/Data-relevant', '', '| Rank | User | Combined score | AI fit | Strength |', '|---:|---|---:|---:|---:|']
          for i,x in enumerate(relevant_sorted[:20],1):
              md.append(f'| {i} | [{x["login"]}]({x["profile_url"]}) | {x["ai_competitor_score"]} | {x["ai_data_fit_score"]} | {x["github_strength_score"]} |')
          (OUT/'summary.md').write_text('\n'.join(md),encoding='utf-8')
          PY
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: follower-analysis
          path: output/
          retention-days: 1
