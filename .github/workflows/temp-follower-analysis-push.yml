name: Temporary follower analysis push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ !contains(github.event.head_commit.message, '[analysis-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze public profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/temp_follower_analysis.py
      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "[analysis-output] Add temporary follower analysis results"
          git push
