name: Temporary follower analysis

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: github.event_name != 'issues' || github.event.issue.title == 'Trigger snapshot follower analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use captured follower snapshot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/temp_follower_analysis.py')
          source = path.read_text(encoding='utf-8')
          old = "followers = list_followers(TARGET)\nusernames = [TARGET] + [username for username in followers if username.lower() != TARGET.lower()]"
          new = "usernames = [line.strip() for line in Path('tools/follower_logins_snapshot.txt').read_text(encoding='utf-8').splitlines() if line.strip()]\nfollowers = usernames[1:]"
          if old not in source:
              raise SystemExit('Expected follower-loading source block was not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Analyze public profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/temp_follower_analysis.py
      - name: Commit analysis output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "[analysis-output] Add temporary follower analysis results"
          git push
